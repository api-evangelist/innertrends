name: Innertrends
description: >-
  InnerTrends is a UK-based analytics and data consultancy that operates as a
  fractional data department for SaaS marketing and growth teams. Founded in
  2015 and based in Norwich, England, it builds a marketing and growth data
  warehouse that consolidates customer and attribution data, delivers custom
  reports and customer-journey deep-dive analyses, and provides tracking and
  measurement consulting for product-led and subscription businesses. The
  company is ISO 27001 certified and GDPR compliant. It was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network for
  enrichment. As of this pass it does not publish a public developer API,
  documentation, or SDKs.
